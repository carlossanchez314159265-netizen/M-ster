<style>

<div id="app"></div>
</main>
<script>
const Q=[{"t": "1. Organización de la industria marítima", "q": "¿Qué porcentaje aproximado del comercio mundial (en toneladas) se transporta por mar?", "o": ["Más del 80 %", "Alrededor del 50 %", "Alrededor del 65 %", "Menos del 30 %"], "e": "Más del 80 % del comercio mundial en toneladas va por mar (más de 13.000 Mt en 2025, según Clarksons)."}, {"t": "1. Organización de la industria marítima", "q": "Desde la teoría económica, la función básica del transporte marítimo es crear:", "o": ["Utilidad de lugar", "Utilidad de tiempo", "Valor añadido industrial", "Economías de escala en el puerto"], "e": "Traslada mercancías de zonas de baja utilidad marginal a otras de más alta: «utilidad de lugar» (ejemplo del petróleo de Kuwait a una refinería europea)."}, {"t": "1. Organización de la industria marítima", "q": "¿Quién es el propietario del buque?", "o": ["El titular registral del buque, con independencia de quién lo explote", "Quien lo arma y nombra al capitán", "Quien realiza la gestión comercial", "Quien lo toma en fletamento por tiempo"], "e": "El propietario es el titular registral. Armar y explotar el buque son funciones de armador y naviero, que pueden ser otras personas."}, {"t": "1. Organización de la industria marítima", "q": "El armador es quien:", "o": ["Posee el buque y lo dedica a la navegación en su nombre; se ocupa de la gestión técnico-náutica", "Contrata cargas y clientes (gestión comercial)", "Representa al buque en un puerto concreto", "Intermedia entre fletante y fletador a cambio de comisión"], "e": "Armador = gestión técnico-náutica (equipa, nombra capitán, tripulación, mantenimiento, certificados, seguros). Es responsable de los actos de la dotación."}, {"t": "1. Organización de la industria marítima", "q": "¿Cuántos armadores puede tener un buque en un momento dado?", "o": ["Solo uno", "Uno por cada contrato de fletamento", "Dos: el propietario y el fletador", "Los que quiera el naviero"], "e": "Todo buque (mercante, pesca, recreo…) tiene un armador, y solo uno. En cambio puede haber varios navieros encadenados por subfletamentos."}, {"t": "1. Organización de la industria marítima", "q": "El naviero es la figura que realiza:", "o": ["La gestión comercial del buque (búsqueda de cargas y contratación con clientes)", "La gestión técnico-náutica", "La representación en puerto", "El peritaje de averías"], "e": "Naviero = explotación comercial. En un time charter, el fletador es el naviero."}, {"t": "1. Organización de la industria marítima", "q": "En un fletamento por tiempo (time charter), el fletante es normalmente:", "o": ["El armador del buque", "El cargador", "El consignatario", "El naviero fletador"], "e": "El fletante en T/C es el armador (sea o no propietario); el fletador es el naviero que explota comercialmente el buque."}, {"t": "1. Organización de la industria marítima", "q": "En un fletamento por viaje, el fletador es:", "o": ["Quien contrata el servicio para un viaje concreto (exportador, importador, comerciante…)", "El armador", "El propietario", "El práctico"], "e": "En voyage charter el fletante es un naviero y el fletador es quien necesita transportar la carga."}, {"t": "1. Organización de la industria marítima", "q": "El gestor naval (ship manager):", "o": ["Gestiona parte de la explotación del buque por cuenta del armador, normalmente la gestión náutica, y no es fletador", "Es el fletador por tiempo del buque", "Es la máxima autoridad a bordo", "Sólo existe en España"], "e": "Opera siempre por cuenta ajena, como agente del armador. Es una figura poco frecuente en España pero muy extendida en el extranjero."}, {"t": "1. Organización de la industria marítima", "q": "El consignatario:", "o": ["Representa al armador o naviero en un puerto y contrata servicios portuarios por su cuenta", "Capta carga para una línea regular", "Organiza el transporte multimodal por cuenta del cargador", "Tramita importaciones ante la Aduana"], "e": "El consignatario actúa por encargo y por cuenta del armador/naviero: servicios portuarios, relación con autoridades, necesidades de la tripulación."}, {"t": "1. Organización de la industria marítima", "q": "El agente de carga (cargo agent):", "o": ["Capta y contrata carga por cuenta de una naviera para sus buques de línea regular y firma los conocimientos de embarque", "Representa al buque en puerto", "Es el intermediario en fletamentos tramp", "Hace de práctico"], "e": "Es propio de líneas regulares; muchas veces es también consignatario."}, {"t": "1. Organización de la industria marítima", "q": "El corredor marítimo (bróker) es:", "o": ["El intermediario comercial entre fletante y fletador, a cambio de comisión", "El intermediario en seguros", "El que hace el peritaje de averías", "El agente de aduanas"], "e": "Bróker = agente de fletamentos. Cobra una comisión (en los ejercicios, 2,5 % o 3 % del flete bruto). El corredor de seguros es otra figura."}, {"t": "1. Organización de la industria marítima", "q": "El transitario (freight forwarder):", "o": ["Organiza y coordina el transporte, frecuentemente multimodal, por cuenta de cargadores", "Representa a la naviera en puerto", "Es el máximo responsable a bordo", "Realiza la liquidación de la avería gruesa"], "e": "Contrata o coordina transporte marítimo y terrestre, almacenamiento, trámites; puede hacer grupaje (consolidación)."}, {"t": "1. Organización de la industria marítima", "q": "¿Cuál de estas figuras estima los daños y causas de una avería, por cuenta del seguro o de parte?", "o": ["Comisario de averías (marine surveyor)", "Liquidador de averías", "Práctico", "Agente de aduanas"], "e": "El comisario de averías hace los peritajes. El liquidador de averías interviene en la liquidación de una avería gruesa."}, {"t": "1. Organización de la industria marítima", "q": "El práctico (pilot) es:", "o": ["Un técnico asesor náutico del capitán en las entradas y salidas de puerto", "El jefe técnico del buque", "El representante del armador en puerto", "El que estiba la carga"], "e": "Asesora al capitán en maniobras de entrada y salida de puerto."}, {"t": "1. Organización de la industria marítima", "q": "Las funciones del capitán son de tres tipos:", "o": ["Técnicas, comerciales y públicas", "Técnicas, financieras y laborales", "Náuticas, jurídicas y fiscales", "Comerciales, aduaneras y portuarias"], "e": "Técnicas (navegación, mantenimiento, personal), comerciales (carga, conocimientos de embarque) y públicas (autoridad y fedatario a bordo, cada vez menos)."}, {"t": "1. Organización de la industria marítima", "q": "La diferencia entre «dotación» y «tripulación» es que:", "o": ["La dotación incluye a todo el personal que trabaja habitualmente a bordo; «tripulación» suele referirse solo al personal técnico-náutico", "Son exactamente lo mismo", "La tripulación incluye a los pasajeros", "La dotación es solo el personal de máquinas"], "e": "«Tripulación» es un término jurídicamente impreciso. La dotación abarca también asistentes de cabina, músicos, etc."}, {"t": "1. Organización de la industria marítima", "q": "Los elementos reales del transporte marítimo son:", "o": ["El buque, las infraestructuras, la carga y el flete", "Armador, naviero y capitán", "El bróker y el transitario", "La OMI y la OIT"], "e": "Elementos personales = personas (armador, naviero, capitán…). Elementos reales = cosas (buque, infraestructuras, carga) más el flete."}, {"t": "1. Organización de la industria marítima", "q": "El «cambio de forma de la carga» consiste en:", "o": ["Dotar a la carga de características que permitan manipularla como si fuera granel de fácil manejo (paletización, contenerización, ro-ro…)", "Cambiar la carga de un buque a otro", "Licuar el petróleo", "Cambiar el puerto de destino"], "e": "Preeslingado, paletización y sobre todo contenerización han revolucionado el transporte multimodal y reducido tiempos en puerto."}, {"t": "1. Organización de la industria marítima", "q": "¿Qué es el flete?", "o": ["El precio del servicio de transporte marítimo", "La carga transportada", "El coste del combustible", "La comisión del bróker"], "e": "En inglés «freight» significa tanto flete como carga, de ahí la confusión."}, {"t": "1. Organización de la industria marítima", "q": "La OMI (Organización Marítima Internacional):", "o": ["Tiene su sede en Londres y se encarga de la seguridad, la protección y la prevención de la contaminación marina", "Tiene su sede en Ginebra y regula las normas laborales", "Es una agencia de la UE", "Es una asociación privada de navieros"], "e": "OMI = agencia de la ONU con sede en Londres. La OIT (1919) se encarga de las normas laborales, con carácter tripartito."}, {"t": "1. Organización de la industria marítima", "q": "Los convenios internacionales de la OMI y la OIT:", "o": ["No son leyes de aplicación directa: son modelos que cada Estado desarrolla en su legislación", "Son leyes directamente aplicables en todos los países", "Solo obligan a los países de la UE", "Solo regulan la tripulación"], "e": "Los convenios son la base del derecho marítimo, pero cada Estado debe incorporarlos a su legislación."}, {"t": "1. Organización de la industria marítima", "q": "La IACS (Asociación Internacional de Sociedades de Clasificación):", "o": ["Se creó en 1968, tiene 12 miembros y controla más del 90 % del mercado de clasificación", "Se creó en 1948 y regula la contaminación", "Representa a los armadores de petroleros", "Es una agencia de la UE"], "e": "Las sociedades de clasificación emiten el Certificado de Clase, necesario para asegurar un buque. Surgieron en el siglo XVIII por los aseguradores."}, {"t": "1. Organización de la industria marítima", "q": "¿Qué organización representa a las empresas de servicios regulares (portacontenedores, ro-ro, portavehículos)?", "o": ["World Shipping Council (WSC)", "INTERTANKO", "INTERCARGO", "ITF"], "e": "INTERTANKO: armadores independientes de tanques; INTERCARGO: graneleros; ITF: sindicatos de transporte; ICS: navieras en general (>80 % de la flota)."}, {"t": "1. Organización de la industria marítima", "q": "BIMCO es conocida sobre todo por:", "o": ["Elaborar formularios-modelo de contratos marítimos (pólizas de fletamento, conocimientos…) que son estándar del mercado", "Agrupar a los clubes P&I", "Representar a los marinos", "Clasificar los buques"], "e": "BIMCO (1905, Copenhague) es la mayor asociación privada del mundo marítimo; su Comité Documentario mantiene los formularios."}, {"t": "1. Organización de la industria marítima", "q": "Los clubes de Protección e Indemnización (P&I) son:", "o": ["Mutuas de seguros de las propias navieras que cubren responsabilidades derivadas de la explotación del buque", "Aseguradoras de mercancías", "Sociedades de clasificación", "Asociaciones de brókeres"], "e": "Reparten los costes a prorrata entre sus miembros; cada buque paga un anticipo según su GT y, si hace falta, una derrama."}, {"t": "1. Organización de la industria marítima", "q": "Tráficos tramp: ¿qué afirmación es correcta?", "o": ["Mueven grandes partidas de graneles de bajo valor específico (normalmente < 500 $/t), unos 75 % del tonelaje transportado", "Mueven carga general con salidas anunciadas", "Son el 25 % del tonelaje y los de mayor suma de fletes", "Se transportan siempre en contenedores"], "e": "Tramp: buques que se fletan para uno o pocos viajes (vida «errante»). Por su bajo valor necesitan minimizar el coste por tonelada."}, {"t": "1. Organización de la industria marítima", "q": "Servicios de línea regular: ¿qué es cierto?", "o": ["Mueven carga general (≈70 % en contenedores), alrededor del 25 % del tonelaje, pero pagan en conjunto más fletes que los graneles", "Mueven el 75 % del tonelaje", "Los fletes totales son menores que en graneles", "Se contratan por viaje con flete $/t"], "e": "Mayor valor de la mercancía y, sobre todo, mayor coste de manipulación (carga, descarga, estiba) explican los mayores fletes en conjunto."}, {"t": "1. Organización de la industria marítima", "q": "Según el ICS, ¿qué porcentaje de la contaminación marina proviene de tierra?", "o": ["88 %", "12 %", "50 %", "25 %"], "e": "Una de las ideas sobre el carácter «respetuoso con el medioambiente» del transporte marítimo."}, {"t": "1. Organización de la industria marítima", "q": "En el estudio de costes externos del transporte en la UE (CE Delft), ¿qué parte se debe al transporte terrestre?", "o": ["El 80 %", "El 20 %", "El 50 %", "El 96 %"], "e": "Costes externos ≈ 750.000 M€ (3 % del PIB de la UE); el 80 % corresponde al transporte terrestre. Ese estudio no incluía el marítimo."}, {"t": "1. Organización de la industria marítima", "q": "Las «Cuatro Marinas» son:", "o": ["De guerra, de pesca, mercante y deportiva", "Mercante, pasaje, crucero y offshore", "Carga, pasaje, pesca y recreo", "Costera, de altura, fluvial y de recreo"], "e": "Son los cuatro sectores marítimos que tienen al buque y la navegación como centro de su actividad."}, {"t": "1. Organización de la industria marítima", "q": "Dentro de la economía azul, ¿qué sector tiene mayor relevancia económica?", "o": ["El transporte marítimo (más del 60 % de la cifra de negocio de las actividades marítimas)", "La pesca", "El turismo costero", "La construcción naval"], "e": "Fuente citada: Stopford, Maritime Economics."}, {"t": "1. Organización de la industria marítima", "q": "Una característica económica del transporte marítimo es que:", "o": ["Es intensivo en capital y muy cíclico: oferta rígida a corto plazo y fletes muy volátiles", "Tiene oferta muy flexible a corto plazo", "Está poco regulado internacionalmente", "Es un mercado monopolístico"], "e": "Además se comporta como un mercado «casi perfecto» por la abundante información disponible."}, {"t": "2. Coste del transporte y modalidades de explotación", "q": "La amortización contable es:", "o": ["Un coste (y gasto) pero no un pago", "Un pago pero no un coste", "Un pago y un coste", "Ni pago ni coste"], "e": "Es un apunte contable que refleja el desgaste del buque; figura en la cuenta de explotación pero no supone salida de fondos."}, {"t": "2. Coste del transporte y modalidades de explotación", "q": "La devolución del principal de un préstamo es:", "o": ["Un pago (salida de caja) pero no un coste ni un gasto", "Un coste que figura en la cuenta de explotación", "Parte del CAPEX", "Parte del OPEX"], "e": "No confundir con la amortización: la devolución del principal es aplicación de fondos, no un coste."}, {"t": "2. Coste del transporte y modalidades de explotación", "q": "CAPEX =", "o": ["Amortización contable + costes financieros (intereses)", "Devolución de principal + intereses", "OPEX + intereses", "Amortización + devolución de principal"], "e": "Costes de capital = lo que aparece en la cuenta de explotación: amortización + intereses."}, {"t": "2. Coste del transporte y modalidades de explotación", "q": "Pagos de capital del ejercicio =", "o": ["Devolución de principal + intereses", "Amortización + intereses", "Amortización + devolución de principal", "Solo intereses"], "e": "Es lo que sale de la caja por razón del buque. En el ejercicio de tesorería también cuenta el pago inicial (down payment)."}, {"t": "2. Coste del transporte y modalidades de explotación", "q": "El OPEX comprende:", "o": ["Tripulación, costes técnicos (M+R+P+L), seguros y administración", "Combustible y costes de puerto", "Amortización e intereses", "Carga y descarga"], "e": "El combustible y los costes de puerto son costes de viaje (VOYEX), no OPEX."}, {"t": "2. Coste del transporte y modalidades de explotación", "q": "Para repartir los costes fijos por día de operación se divide el total anual por:", "o": ["350 días (se supone que el buque está unos 15 días fuera de servicio)", "365 días", "360 días", "Los días del contrato"], "e": "Los costes se devengan los 365 días, pero solo se cobra flete unos 350. Aplica a CAPEX + OPEX. Si el enunciado dice «OPEX 7.000 $/día sobre 365 días», se multiplica por 365 para el total anual."}, {"t": "2. Coste del transporte y modalidades de explotación", "q": "El alquiler mínimo en un arrendamiento a casco desnudo para no tener pérdida debe cubrir:", "o": ["El CAPEX del propietario", "CAPEX + OPEX", "CAPEX + OPEX + costes de viaje", "Solo el OPEX"], "e": "En casco desnudo el propietario soporta solo los costes de capital. El arrendatario asume el OPEX (y el VOYEX si actúa de naviero)."}, {"t": "2. Coste del transporte y modalidades de explotación", "q": "El flete por tiempo mínimo para no tener pérdida (por día de operación) debe cubrir:", "o": ["CAPEX + OPEX", "Solo CAPEX", "CAPEX + OPEX + VOYEX", "Solo OPEX"], "e": "El fletante en T/C asume CAPEX + OPEX; el fletador (naviero) asume los costes de viaje (combustible, puertos, canales)."}, {"t": "2. Coste del transporte y modalidades de explotación", "q": "En un fletamento por viaje (voyage charter), el flete $/t debe cubrir:", "o": ["CAPEX + OPEX + costes de viaje", "Solo CAPEX + OPEX", "Solo costes de viaje", "CAPEX + OPEX + carga y descarga en cualquier caso"], "e": "El fletante soporta los costes de viaje. La carga y descarga solo corre por su cuenta si no es FIOS (por ejemplo, en línea regular)."}, {"t": "2. Coste del transporte y modalidades de explotación", "q": "El arrendamiento a casco desnudo:", "o": ["No es un fletamento; se cede la posesión del buque y el arrendatario es su armador", "Es un tipo de fletamento por tiempo", "Es un fletamento por viaje", "El propietario sigue armando y tripulando el buque"], "e": "El profesor insiste: nunca «fletamento a casco desnudo». En inglés a ambos se les llama «charter»."}, {"t": "2. Coste del transporte y modalidades de explotación", "q": "En el fletamento por tiempo (time charter):", "o": ["El fletante retiene la gestión náutica y el fletador asume la gestión comercial y los costes de viaje", "El fletador asume la gestión náutica", "El fletante paga el combustible", "El flete se expresa en $/t"], "e": "El flete se pacta en $/día. Junto con la cesión, hay una prestación de servicios del fletante: mantener el buque armado, tripulado y navegable."}, {"t": "2. Coste del transporte y modalidades de explotación", "q": "El trip charter es:", "o": ["Un caso especial de time charter cuya duración es la del viaje y con flete en $/día", "Un fletamento por viaje con flete en $/t", "Un contrato de línea regular", "Un arrendamiento a casco desnudo"], "e": "Reparto de costes como en el T/C; la duración no se fija a priori."}, {"t": "2. Coste del transporte y modalidades de explotación", "q": "El contrato de transporte COA (Contract of Affreightment):", "o": ["Fleta uno o más buques para transportar una cantidad determinada de mercancía en los viajes necesarios; flete $/t y reparto de costes de V/C", "Es un T/C de larga duración", "Es un contrato de casco desnudo", "Fija el flete en $/día"], "e": "Puede usar buques propios o tomados en fletamento de terceros."}, {"t": "2. Coste del transporte y modalidades de explotación", "q": "Condiciones FIOS (Free In Out Stowed):", "o": ["Los costes de carga, descarga y estiba corren a cargo del fletador/cargador", "Los costes de carga y descarga corren a cargo del naviero", "Solo la carga corre a cargo del cargador", "Todo corre a cargo del armador"], "e": "Son las habituales en tramp. Si hay FIOS, el dato «coste de carga/descarga por t» del enunciado no se usa."}, {"t": "2. Coste del transporte y modalidades de explotación", "q": "En condiciones Liner Terms muelle-muelle, los costes de manipulación de la carga corren a cargo de:", "o": ["El naviero (porteador)", "El cargador", "El fletador por tiempo no", "El propietario"], "e": "En línea regular el naviero soporta también carga/descarga (movimientos por TEU en el ejercicio ContSea)."}, {"t": "2. Coste del transporte y modalidades de explotación", "q": "Costes de viaje proporcionales a la actividad:", "o": ["Consumos de combustible en navegación y en puerto", "Tasas portuarias al buque", "Tarifas de canales", "Comisiones"], "e": "Los no proporcionales son costes de puerto, canales y otros (comisiones)."}, {"t": "2. Coste del transporte y modalidades de explotación", "q": "Régimen de tonnage tax:", "o": ["La base imponible depende del tonelaje de arqueo neto, no del beneficio; se paga una cantidad fija", "Se paga un % del beneficio", "No se paga impuesto", "Solo se paga si hay pérdidas"], "e": "En los ejercicios, el impuesto es una cifra fija anual (p. ej. 15.000 $)."}, {"t": "2. Coste del transporte y modalidades de explotación", "q": "En un régimen fiscal normal, si se eligen criterios de cálculo que aumentan los costes:", "o": ["Disminuye el beneficio y se pagan menos impuestos", "Aumenta el beneficio", "Se pagan más impuestos", "No cambia nada"], "e": "Lo importante es mantener un criterio uniforme a largo plazo."}, {"t": "2. Coste del transporte y modalidades de explotación", "q": "En el sistema alemán de amortización de un préstamo:", "o": ["La cuota de principal es constante y los intereses decrecen", "La cuota total es constante", "Los intereses son constantes", "Se devuelve todo al final"], "e": "Intereses del año = tipo × principal pendiente al comienzo del año."}, {"t": "2. Coste del transporte y modalidades de explotación", "q": "Un préstamo a 10 años «con 2 años de carencia» (sistema alemán):", "o": ["Durante los 2 años de carencia solo se pagan intereses; después se devuelve el principal en cuotas constantes", "No se pagan intereses en los 2 primeros años", "Se devuelve todo el principal en el año 3", "Los intereses son menores"], "e": "Con carencia el principal pendiente se mantiene en la carencia. Ojo con la redacción: «10 + 2 de carencia» o «10, de los que 2 de carencia (devolución en 8)»."}, {"t": "2. Coste del transporte y modalidades de explotación", "q": "Un buque cuesta 20 M$, valor residual 10 %, amortización lineal en 15 años. La amortización anual es:", "o": ["1.200.000 $", "1.333.333 $", "1.800.000 $", "1.500.000 $"], "e": "(20.000.000 × 0,9) / 15 = 1.200.000. Se amortiza el valor menos el residual."}, {"t": "2. Coste del transporte y modalidades de explotación", "q": "Préstamo de 16 M$ a 10 años, sistema alemán, 5 %. Intereses del tercer año:", "o": ["640.000 $", "800.000 $", "720.000 $", "560.000 $"], "e": "Cuota de principal 1,6 M$. Principal pendiente al inicio del 3.er año = 16 − 2×1,6 = 12,8 M$; intereses = 5 % × 12,8 M$ = 640.000 $."}, {"t": "2. Coste del transporte y modalidades de explotación", "q": "El flete neto es 9.700 $/día tras una comisión del 3 % sobre el flete bruto. El flete bruto es:", "o": ["10.000 $/día", "9.991 $/día", "9.409 $/día", "9.991,5 $/día"], "e": "Neto = bruto × (1 − 0,03) ⇒ bruto = neto / 0,97 = 10.000. No sumes 3 % al neto ni multipliques por 1,03."}, {"t": "2. Coste del transporte y modalidades de explotación", "q": "Distancia 2.400 millas, 12,5 nudos. Duración de la navegación:", "o": ["8 días", "4,8 días", "12 días", "192 días"], "e": "días = millas / nudos / 24 = 2.400 / 12,5 / 24 = 8 días."}, {"t": "2. Coste del transporte y modalidades de explotación", "q": "8 cargamentos entre dos puertos, contrato que termina tras la última descarga. ¿Cuántos tramos de navegación en lastre hay?", "o": ["7", "8", "9", "16"], "e": "El último retorno no está incluido en el contrato: n cargas → n tramos en carga y n − 1 en lastre."}, {"t": "2. Coste del transporte y modalidades de explotación", "q": "OPEX de 2026 estimado = OPEX 2025 × 1,03 = 2.060.000 $. OPEX por día de operación (350 días):", "o": ["5.885,71 $", "5.643,84 $", "5.314,29 $", "7.000 $"], "e": "2.060.000 / 350 = 5.885,71. En un contrato de 30 días la incidencia sería 30 × 5.885,71."}, {"t": "2. Coste del transporte y modalidades de explotación", "q": "TCE de un viaje = ", "o": ["(ingresos netos de comisión − costes de viaje) / días", "Ingresos brutos / días", "Ingresos netos / días sin restar nada", "(ingresos − OPEX) / días"], "e": "Se compara con el flete neto por día del time charter para decidir qué opción conviene."}, {"t": "2. Coste del transporte y modalidades de explotación", "q": "Ingresos netos 1.000.000 $, combustible 300.000 $, puertos 100.000 $, 60 días. El TCE es:", "o": ["10.000 $/día", "16.667 $/día", "11.667 $/día", "6.667 $/día"], "e": "(1.000.000 − 300.000 − 100.000) / 60 = 10.000 $/día."}, {"t": "2. Coste del transporte y modalidades de explotación", "q": "En un servicio de línea regular, el naviero soporta:", "o": ["CAPEX + OPEX + costes de viaje + carga/descarga", "Solo CAPEX + OPEX", "Solo costes de viaje", "Solo carga/descarga"], "e": "Es la modalidad en la que el cedente asume más costes."}, {"t": "2. Coste del transporte y modalidades de explotación", "q": "Ejercicio ContSea, buque en T/C: ¿qué NO se incluye en los costes?", "o": ["CAPEX y OPEX del buque", "Flete T/C bruto", "Combustible", "Tasas portuarias"], "e": "Si el buque se toma en T/C se paga el flete (bruto); si es propio, se sustituye el flete por CAPEX + OPEX."}, {"t": "2. Coste del transporte y modalidades de explotación", "q": "Un T/C de 6 meses con flete neto de 12.500 $/día (6 meses × 30 días) y comisión del 3 %. Flete bruto total:", "o": ["≈ 2.319.588 $", "2.250.000 $", "2.317.500 $", "2.182.500 $"], "e": "2.250.000 / 0,97 ≈ 2.319.588."}, {"t": "2. Coste del transporte y modalidades de explotación", "q": "Fondos mínimos iniciales para abordar la compra de un buque: se calculan como:", "o": ["Pago inicial (fondos propios) + déficit máximo acumulado de tesorería", "Solo la devolución de principal", "Solo el OPEX del primer año", "El valor residual"], "e": "En el ejercicio de casa el margen de tesorería acumulado nunca fue negativo, así que los fondos necesarios eran solo el 40 % del precio = 8,8 M$."}, {"t": "3. Emisiones a la atmósfera", "q": "El transporte marítimo representa aproximadamente, del total global, el…", "o": ["2,4 % de las emisiones de CO₂, 11 % de las de SOx y 19 % de las de NOx", "2,4 % de SOx y 19 % de CO₂", "11 % de CO₂", "50 % de NOx"], "e": "Además un 6 % de la materia particulada. El «talón de Aquiles» del marítimo son SOx y NOx."}, {"t": "3. Emisiones a la atmósfera", "q": "Emisiones específicas (g/t·km): el modo con mayores emisiones de casi todos los gases es:", "o": ["El avión", "El buque", "El ferrocarril", "La carretera"], "e": "Hay que usar emisiones específicas, no absolutas: el avión parece pequeño en absolutas porque su cuota en el transporte de mercancías es casi nula (el 90 % del comercio internacional va por mar)."}, {"t": "3. Emisiones a la atmósfera", "q": "El Anexo VI de MARPOL regula:", "o": ["Las emisiones a la atmósfera de los buques", "Los vertidos de hidrocarburos", "Las aguas de lastre", "La seguridad de la vida humana en el mar"], "e": "Lo han ratificado 108 países que controlan el 97 % de la flota."}, {"t": "3. Emisiones a la atmósfera", "q": "Los gases contaminantes (SOx, NOx, PM) se diferencian de los GEI en que:", "o": ["Sus efectos son locales o regionales; los GEI actúan a escala planetaria", "Sus efectos son planetarios", "Los GEI causan lluvia ácida", "No afectan a la salud"], "e": "SOx/NOx causan lluvia ácida y problemas de salud cerca del lugar de emisión; el CO₂ se acumula y causa cambio climático."}, {"t": "3. Emisiones a la atmósfera", "q": "La lluvia ácida es más dañina en suelos:", "o": ["Graníticos (norte de Europa); los calcáreos la neutralizan", "Calcáreos (sur de Europa)", "Arenosos", "Marinos"], "e": "Por eso las ECA se justifican más en el norte de Europa."}, {"t": "3. Emisiones a la atmósfera", "q": "Efectos cruzados entre emisiones:", "o": ["Reducir azufre con desulfuración en refinería consume energía y genera más CO₂", "Reducir NOx baja el consumo", "Reducir SOx baja el CO₂ siempre", "No hay efectos cruzados"], "e": "Igual con NOx: reducir temperatura/revoluciones baja el rendimiento y aumenta el consumo (y el CO₂). De ahí el enfoque «holístico»."}, {"t": "3. Emisiones a la atmósfera", "q": "Límite general de azufre en los combustibles marinos desde el 1 enero 2020:", "o": ["0,5 % en masa", "3,5 %", "0,1 %", "1,5 %"], "e": "Supuso una reducción del 86 % respecto al 3,5 % anterior y de un 70 % en las emisiones de SOx de los buques."}, {"t": "3. Emisiones a la atmósfera", "q": "Límite de azufre en las zonas SECA desde el 1 enero 2015:", "o": ["0,1 % (1.000 ppm)", "0,5 %", "1 %", "10 ppm"], "e": "Para el transporte terrestre es solo 10 ppm."}, {"t": "3. Emisiones a la atmósfera", "q": "El FONAR es:", "o": ["El informe de indisponibilidad de combustible que cumpla los límites de azufre", "Una exención automática", "Un certificado de clase", "Un plan de eficiencia"], "e": "No supone exención automática: la autoridad valora las pruebas aportadas. No exige desviarse de la ruta."}, {"t": "3. Emisiones a la atmósfera", "q": "Zonas de control de emisiones: ¿cuál es SECA desde el 1 mayo 2025?", "o": ["El mar Mediterráneo", "El mar Báltico", "El Atlántico nororiental", "El mar de Noruega"], "e": "Báltico 2006, Mar del Norte y Canal 2007, Norteamérica 2011, Caribe EEUU 2014. Atlántico NE adoptada en 2026 (vigor 1 sept 2027). El Mediterráneo aún no es NECA."}, {"t": "3. Emisiones a la atmósfera", "q": "Límites de NOx de MARPOL (Tier):", "o": ["Tier II: −20 % respecto a Tier I (buques desde 2011); Tier III: −80 % respecto a Tier I, solo en NECAs", "Tier III se aplica en todos los mares", "Tier I: −80 %", "Tier II es −50 %"], "e": "El Nivel III solo para buques construidos después de la fecha fijada para cada NECA."}, {"t": "3. Emisiones a la atmósfera", "q": "Para cumplir el límite de NOx de Tier III sin cambiar de combustible, las dos tecnologías principales son:", "o": ["SCR (reducción catalítica selectiva, con urea) y EGR (recirculación de gases)", "Scrubber y GNL", "Scrubber húmedo y seco", "Vela y baterías"], "e": "SCR encarece el OPEX por la urea; EGR baja el rendimiento y aumenta el consumo."}, {"t": "3. Emisiones a la atmósfera", "q": "El EEDI se aplica a:", "o": ["Buques nuevos de GT > 400 con contrato desde 1.1.2013 o entrega desde 1.7.2015", "Todos los buques existentes", "Buques de más de 5.000 GT existentes", "Solo petroleros"], "e": "Es el cociente entre emisiones de CO₂ y capacidad de transporte y debe ser menor que una línea de referencia que se endurece por fases."}, {"t": "3. Emisiones a la atmósfera", "q": "El SEEMP:", "o": ["Es un plan de gestión de la eficiencia energética que deben llevar a bordo todos los buques, con 4 fases", "Solo es obligatorio para buques nuevos", "Es un índice de proyecto", "Es un impuesto"], "e": "Planificación, implantación, monitorización y evaluación/mejora."}, {"t": "3. Emisiones a la atmósfera", "q": "El DCS de la OMI:", "o": ["Sistema de recopilación de datos de consumo de combustible, en vigor desde el 1 enero 2019", "Entró en vigor en 2018", "Verifica por un tercero acreditado y publica datos", "Solo se aplica en la UE"], "e": "El MRV europeo (Reglamento 757/2015) empezó en 2018. Diferencias con el DCS: verificador independiente acreditado y posibilidad de publicidad en el MRV."}, {"t": "3. Emisiones a la atmósfera", "q": "EEXI y CII (desde 1 enero 2023): ¿cuál es correcta?", "o": ["EEXI: buques existentes ≥ 400 GT, índice intrínseco que se obtiene una vez. CII: buques ≥ 5.000 GT, índice operacional anual", "EEXI se calcula cada año y CII una vez", "Ambos se aplican a ≥ 400 GT", "El CII solo se aplica a buques nuevos"], "e": "El CII clasifica de A a E; D tres años seguidos o E obliga a un plan de acción correctiva."}, {"t": "3. Emisiones a la atmósfera", "q": "Reducción exigida del CII:", "o": ["−5 % en 2023 y −2 % anual hasta 2026 (−11 % sobre 2019); desde 2027, 2,625 % anual hasta −21,5 % en 2030", "−2 % en 2023", "−50 % en 2030", "−11 % en 2023"], "e": "Acordado en MEPC 83 (abril 2025) para el tramo 2027-2030."}, {"t": "3. Emisiones a la atmósfera", "q": "Reglamento MRV (UE) 757/2015: ¿a quién se aplica?", "o": ["Buques ≥ 5.000 GT que escalan en puertos del EEE y transportan carga/pasajeros con fines comerciales", "A todos los buques de la UE", "Solo a buques de bandera UE", "A buques ≥ 400 GT"], "e": "Seguimiento, notificación y verificación de las emisiones de CO₂, con independencia de bandera o nacionalidad del armador."}, {"t": "3. Emisiones a la atmósfera", "q": "El EU ETS marítimo desde el 1 enero 2024 cubre, para buques ≥ 5.000 GT:", "o": ["50 % de emisiones de viajes UE ↔ tercer país, 100 % de los intracomunitarios y 100 % de las producidas en puerto UE", "100 % de todos los viajes", "50 % de los intracomunitarios", "Solo las emisiones en puerto"], "e": "Implantación gradual: 40 % de las emisiones verificadas de 2024, 70 % de 2025 y 100 % de 2026. Exención temporal (hasta 2030) para Canarias e islas menores."}, {"t": "3. Emisiones a la atmósfera", "q": "Con el EU ETS, un precio de 80 €/t CO₂ y un factor de 3,114 t CO₂/t de fueloil, entregar derechos por 1 t de combustible cuesta aproximadamente:", "o": ["250 €", "80 €", "10 €", "1.000 €"], "e": "3,114 × 80 ≈ 250 €. Con un fueloil de 550 €/t supone un aumento ≈ 45 % del coste del combustible."}, {"t": "3. Emisiones a la atmósfera", "q": "El EU ETS es un sistema:", "o": ["Cap and trade: tope global de emisiones y compraventa de derechos; reducción anual del tope del 4,2 %", "De impuesto fijo", "De subvenciones", "Voluntario"], "e": "Los precios son muy volátiles."}, {"t": "3. Emisiones a la atmósfera", "q": "El Reglamento FuelEU Maritime (2023/1805):", "o": ["Limita la intensidad media anual de GEI de la energía utilizada (−2 % 2025, −6 % 2030, −14,5 % 2035, −31 % 2040, −62 % 2045, −80 % 2050)", "Prohíbe los motores diésel", "Regula el azufre", "Es un impuesto sobre el fueloil"], "e": "Ciclo de vida «pozo a la estela», pooling, banking y borrowing. Obliga a conexión eléctrica en puerto (OPS) a portacontenedores y pasaje ≥ 5.000 GT desde 2030."}, {"t": "3. Emisiones a la atmósfera", "q": "El CBAM afecta a:", "o": ["Importaciones de cemento, electricidad, fertilizantes, aluminio, hidrógeno, hierro y acero", "Los combustibles marinos", "El tráfico de cruceros", "La exportación de petróleo"], "e": "Mecanismo de ajuste en frontera de carbono; primer periodo solo notificación, pagos desde enero de 2026."}, {"t": "3. Emisiones a la atmósfera", "q": "Objetivos de la Estrategia de GEI de la OMI (2023):", "o": ["Cero emisiones netas hacia 2050; −20 % en 2030 y −70 % en 2040; 5 % de energía ZNZ en 2030", "−50 % en 2050", "Cero neto en 2030", "Solo reducir el azufre"], "e": "Entre paréntesis, objetivos ambiciosos: 30 % en 2030 y 80 % en 2040, 10 % de ZNZ."}, {"t": "3. Emisiones a la atmósfera", "q": "Tres vías para reducir las emisiones de CO₂ del transporte marítimo:", "o": ["Reducir la actividad, reducir las emisiones unitarias y compensar económicamente", "Aumentar velocidad, calado y potencia", "Solo cambiar de combustible", "Solo scrubbers"], "e": "La primera se considera irreal (el sector atiende a una demanda); la segunda se hace con medidas técnicas y operacionales; la tercera con instrumentos de mercado."}, {"t": "3. Emisiones a la atmósfera", "q": "Marco de Cero Neto de la OMI (NZF):", "o": ["Aprobado en abril de 2025 (MEPC 83); su adopción se aplazó un año en octubre de 2025 y sigue pendiente; no es aún obligatorio", "Ya en vigor desde 2025", "Fue rechazado definitivamente", "Es una tasa fija por tonelada"], "e": "Se basa en un estándar de intensidad de GEI de dos niveles con Remedial Units (RU: 100 $/t nivel 1 y 380 $/t nivel 2) y unidades excedentarias; fondo de cero emisiones netas de la OMI."}, {"t": "3. Emisiones a la atmósfera", "q": "Vías para cumplir los límites de azufre:", "o": ["Combustibles bajos en azufre (VLSFO/MGO), HFO con scrubber o combustibles alternativos (GNL, metanol…)", "Solo scrubbers", "Solo cambiar de ruta", "Solo reducir velocidad"], "e": "Destilados: simple pero más caro. Scrubber: reduce SOx un 90-95 %, cuesta 2-4 M€ y recupera la inversión en 1-2 años. GNL: reduce NOx hasta 85 %; el CO₂ neto baja 9-20 % por el «methane slip»."}, {"t": "3. Emisiones a la atmósfera", "q": "El ejercicio del parcial incluyó el EU ETS: ¿qué emisiones computan en un viaje San Lorenzo ↔ Tarragona?", "o": ["50 % de las de navegación y 100 % de las de las escalas en el puerto de la UE", "100 % de las de navegación", "50 % de las de la escala en Tarragona", "Solo las de la escala en San Lorenzo"], "e": "No computan las escalas en el puerto no comunitario. Coste = t CO₂ × 80 €/t × 1,15 $/€."}];
const topics=[...new Set(Q.map(x=>x.t))];
const app=document.getElementById('app');
let st=null;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function menu(){
  app.innerHTML=`<div class="card"><p>${Q.length} preguntas. Elige tema y número de preguntas. Las opciones se barajan en cada intento.</p>
  <div class="row"><label>Tema <select id="t"><option value="">Todos</option>${topics.map(t=>`<option>${t}</option>`).join('')}</select></label>
  <label>Preguntas <select id="n"><option>10</option><option>20</option><option>30</option><option value="999">Todas</option></select></label>
  <button class="p" id="go">Empezar</button></div></div>`;
  document.getElementById('go').onclick=()=>{
    const t=document.getElementById('t').value,n=+document.getElementById('n').value;
    let pool=Q.filter(x=>!t||x.t===t);
    st={qs:shuffle(pool).slice(0,n).map(x=>({...x,o:shuffle(x.o.map((s,i)=>({s,ok:i===0})))})),i:0,score:0,wrong:[]};
    show();
  };
}
function show(){
  if(st.i>=st.qs.length)return end();
  const x=st.qs[st.i];let done=false;
  app.innerHTML=`<div class="card"><div class="meta"><span>${x.t}</span><span>${st.i+1}/${st.qs.length} · aciertos ${st.score}</span></div>
  <p><b>${x.q}</b></p><div id="os">${x.o.map((o,k)=>`<button class="opt" data-k="${k}">${o.s}</button>`).join('')}</div><div id="ex"></div></div>`;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    if(done)return;done=true;const k=+b.dataset.k;
    if(x.o[k].ok)st.score++;else st.wrong.push(x);
    document.querySelectorAll('.opt').forEach((bb,j)=>{if(x.o[j].ok)bb.classList.add('ok');else if(j===k)bb.classList.add('ko')});
    document.getElementById('ex').innerHTML=`<div class="exp">${x.e}</div><p><button class="p" id="nx">${st.i+1<st.qs.length?'Siguiente':'Ver resultado'}</button></p>`;
    document.getElementById('nx').onclick=()=>{st.i++;show()};
  });
}
function end(){
  const p=Math.round(100*st.score/st.qs.length);
  app.innerHTML=`<div class="card"><h2>${st.score} / ${st.qs.length} (${p} %)</h2>
  ${st.wrong.length?`<p>Para repasar:</p><ul>${st.wrong.map(x=>`<li><b>${x.q}</b><br>Respuesta: ${x.o.find(o=>o.ok).s}</li>`).join('')}</ul>`:'<p>¡Sin fallos!</p>'}
  <p class="row"><button class="p" id="re">Repetir fallos</button><button id="m">Menú</button></p></div>`;
  document.getElementById('m').onclick=menu;
  document.getElementById('re').onclick=()=>{if(!st.wrong.length)return menu();
    st={qs:shuffle(st.wrong).map(x=>({...x,o:shuffle(x.o)})),i:0,score:0,wrong:[]};show()};
}
menu();
</script></body></html>
