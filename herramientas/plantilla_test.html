<title>{{TITULO}}</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: una columna de estudio; barra de filtros arriba, una pregunta cada vez, resumen al terminar. Paleta de carta náutica: papel azulado, tinta marina, acento cobre. */
:root{
  --bg:#eef2f4; --surface:#ffffff; --ink:#14232f; --muted:#5a6b78; --line:#d3dce2;
  --accent:#b4572a; --accent-ink:#ffffff; --sel:#e3eaef;
  --ok:#1f7a4d; --ok-bg:#e1f2e8; --bad:#b3261e; --bad-bg:#fbe5e3;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Instrument Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1820; --surface:#16222c; --ink:#e4ebf0; --muted:#93a4b1; --line:#2a3a47;
  --accent:#e08a5c; --accent-ink:#1a0f08; --sel:#1f2f3b;
  --ok:#5fcf93; --ok-bg:#15301f; --bad:#ff8a80; --bad-bg:#3a1a18; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1820; --surface:#16222c; --ink:#e4ebf0; --muted:#93a4b1; --line:#2a3a47;
  --accent:#e08a5c; --accent-ink:#1a0f08; --sel:#1f2f3b;
  --ok:#5fcf93; --ok-bg:#15301f; --bad:#ff8a80; --bad-bg:#3a1a18; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:720px;margin:0 auto;display:grid;gap:18px}
header{display:grid;gap:4px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--display);font-weight:700;font-size:clamp(26px,5vw,34px);line-height:1.1;margin:0;text-wrap:balance}
.lede{color:var(--muted);margin:0;max-width:62ch}
.controls{display:grid;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row-label{font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);min-width:64px}
.chip{font:500 14px/1 var(--body);color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:999px;padding:8px 12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip:focus-visible,.opt:focus-visible,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.toggle{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink);cursor:pointer}
.toggle input{accent-color:var(--accent);width:16px;height:16px}
.status{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;justify-content:space-between;font-size:14px;color:var(--muted)}
.score{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--ink)}
.score .ok{color:var(--ok)} .score .bad{color:var(--bad)}
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;display:grid;gap:14px;min-width:0}
.qmeta{display:flex;gap:8px;flex-wrap:wrap;font-family:var(--mono);font-size:12px;color:var(--muted)}
.tag{border:1px solid var(--line);border-radius:4px;padding:2px 6px}
.qtext{font-family:var(--display);font-weight:600;font-size:clamp(19px,3.6vw,22px);line-height:1.3;margin:0;text-wrap:balance}
.opts{display:grid;gap:8px;list-style:none;margin:0;padding:0}
.opt{width:100%;text-align:left;display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;font:400 16px/1.45 var(--body);color:var(--ink);
  background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;cursor:pointer}
.opt:hover:not(:disabled){background:var(--sel)}
.opt:disabled{cursor:default}
.letter{font-family:var(--mono);font-weight:500;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:13px}
.opt.correct{background:var(--ok-bg);border-color:var(--ok)}
.opt.correct .letter{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad)}
.opt.wrong .letter{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.opt.dim{opacity:.6}
.feedback{border-left:3px solid var(--ok);padding:10px 12px;background:var(--ok-bg);border-radius:0 8px 8px 0}
.feedback.bad{border-left-color:var(--bad);background:var(--bad-bg)}
.feedback strong.v{display:block;margin-bottom:2px}
.feedback .exp{margin:0}
.nav{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
.btn{font:600 15px/1 var(--body);border-radius:8px;padding:12px 16px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.hint{font-size:13px;color:var(--muted);margin:0}
code{font-family:var(--mono);font-size:.9em}
.summary h2{font-family:var(--display);font-size:24px;margin:0}
.big{font-family:var(--display);font-weight:700;font-size:44px;line-height:1;font-variant-numeric:tabular-nums}
.blocks{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.blk{border:1px solid var(--line);border-radius:8px;padding:10px;display:grid;gap:2px}
.blk b{font-family:var(--mono);font-size:12px;color:var(--muted);font-weight:500}
.blk span{font-variant-numeric:tabular-nums;font-weight:600}
.fails{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.fails li{border-top:1px solid var(--line);padding-top:8px;font-size:15px}
.fails .ans{color:var(--ok);font-weight:600}
.empty{color:var(--muted)}
@media (prefers-reduced-motion:reduce){.bar>i{transition:none}}

.hist-row .btn{padding:8px 12px;font-size:14px}
.tag.warn{color:var(--bad);border-color:var(--bad)}
.hlist{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.hlist li{border-top:1px solid var(--line);padding-top:10px;display:grid;gap:4px}
.hlist .meta{font-family:var(--mono);font-size:12px;color:var(--muted)}
.hlist .ans{color:var(--ok);font-weight:600}
.hlist .exp{font-size:14px;color:var(--muted)}
</style>

<div class="wrap">
  <header>
    <span class="eyebrow">{{ASIGNATURA}}</span>
    <h1>{{TITULO}}</h1>
    <p class="lede">{{DESCRIPCION}}</p>
  </header>

  <section class="controls" aria-label="Opciones del test">
    <div class="row" role="group" aria-label="Conjunto de preguntas">
      <span class="row-label">Test</span>
      <button class="chip" id="set-all" data-set="all" aria-pressed="true">Todas ({{N}})</button>
    </div>
    <div class="row" role="group" aria-label="Tema">
      <span class="row-label">Tema</span>
      <button class="chip" id="b-0" data-b="0" aria-pressed="true">Todos</button>{{CHIPS_TEMA}}
    </div>
    <div class="row">
      <span class="row-label">Orden</span>
      <label class="toggle"><input type="checkbox" id="shuffle-q"> Barajar preguntas</label>
      <label class="toggle"><input type="checkbox" id="shuffle-o"> Barajar opciones</label>
    </div>
    <div class="row hist-row" role="group" aria-label="Historial de fallos">
      <span class="row-label">Repaso</span>
      <button class="btn" id="h-pend">Repasar falladas (0)</button>
      <button class="btn" id="h-list">Ver mis fallos</button>
    </div>
    <div class="status">
      <span id="pos">Pregunta 1 de {{N}}</span>
      <span class="score" id="score">✓ <span class="ok">0</span> · ✗ <span class="bad">0</span></span>
    </div>
    <div class="bar" aria-hidden="true"><i id="bar"></i></div>
  </section>

  <main id="main"></main>
  <p class="hint">Teclado: <code>A</code>–<code>D</code> o <code>1</code>–<code>4</code> para responder, <code>Intro</code> o <code>→</code> para seguir.</p>
</div>

<script>
const DATA = {{DATA}};
const LETTERS = "ABCD";
const BNAMES = {{BNAMES}};
const SETNAMES = {T:"{{ETIQUETA}}"};
const KEY = "{{KEY}}";

let state = {set:"all", b:0, shq:false, sho:false};
try { Object.assign(state, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch(e) {}
function save(){ try { localStorage.setItem(KEY, JSON.stringify({set:state.set,b:state.b,shq:state.shq,sho:state.sho})); } catch(e) {} }


const HKEY = KEY + "-historial";
let hist = {};
try { hist = JSON.parse(localStorage.getItem(HKEY) || "{}"); } catch(e) {}
function hsave(){ try { localStorage.setItem(HKEY, JSON.stringify(hist)); } catch(e) {} }
function hrec(q, ok){
  const h = hist[q.q] ??= {f:0, k:0, last:""};
  if (ok) h.k++; else h.f++;
  h.last = ok ? "ok" : "bad"; h.t = Date.now();
  hsave(); hbuttons();
}
function pending(){ return DATA.filter(q => hist[q.q] && hist[q.q].last === "bad"); }
function everFailed(){ return DATA.filter(q => hist[q.q] && hist[q.q].f > 0); }
function hbuttons(){
  const p = document.getElementById("h-pend"); if (!p) return;
  const n = pending().length;
  p.textContent = `Repasar falladas (${n})`; p.disabled = !n;
  document.getElementById("h-list").textContent = `Ver mis fallos (${everFailed().length})`;
}
function renderHist(){
  const main = document.getElementById("main");
  const qs = everFailed().sort((a,b) => (hist[b.q].last==="bad") - (hist[a.q].last==="bad") || hist[b.q].f - hist[a.q].f);
  const items = qs.map(q => { const h = hist[q.q];
    return `<li><span class="meta">${BNAMES[q.b]} · fallada ${h.f} ${h.f===1?"vez":"veces"} · acertada ${h.k} · ${h.last==="bad"?"<b style='color:var(--bad)'>pendiente</b>":"última vez bien"}</span>
      <b>${q.q}</b><span class="ans">✓ ${q.o[q.a]}</span><span class="exp">${q.e}</span></li>`; }).join("");
  main.innerHTML = `<article class="card summary">
    <h2>Mis fallos</h2>
    <p class="empty">Se guardan en este navegador cada vez que respondes. Una pregunta deja de estar <b>pendiente</b> cuando la aciertas en un repaso, pero sigue en la lista con su contador.</p>
    <div class="nav">
      <button class="btn primary" id="hl-go" ${pending().length?"":"disabled"}>Repasar las ${pending().length} pendientes</button>
      <button class="btn" id="hl-dl" ${qs.length?"":"disabled"}>Descargar lista</button>
      <button class="btn" id="hl-clear" ${qs.length?"":"disabled"}>Borrar historial</button>
      <button class="btn" id="hl-back">Volver al test</button>
    </div>
    ${qs.length?`<ul class="hlist">${items}</ul>`:`<p class="empty">Todavía no has fallado ninguna pregunta.</p>`}
  </article>`;
  document.getElementById("hl-go").onclick = () => build(pending().map(q=>q.id));
  document.getElementById("hl-back").onclick = () => build();
  document.getElementById("hl-clear").onclick = () => { if (confirm("¿Borrar todo el historial de fallos de este test?")) { hist = {}; hsave(); hbuttons(); renderHist(); } };
  document.getElementById("hl-dl").onclick = () => {
    const txt = "# Mis fallos · " + document.title + "\n\n" + qs.map((q,i) => { const h = hist[q.q];
      return `## ${i+1}. ${q.q}\n\n- Tema: ${BNAMES[q.b]}\n- Fallada ${h.f} · acertada ${h.k}${h.last==="bad"?" · pendiente":""}\n- Respuesta: **${q.o[q.a]}**\n\n${q.e}\n`; }).join("\n");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([txt], {type:"text/markdown"}));
    a.download = "mis_fallos_" + KEY + ".md"; document.body.appendChild(a); a.click(); a.remove();
  };
}

let deck = [], idx = 0, answers = {}, onlyIds = null;

function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

function build(ids){
  onlyIds = ids || null;
  let qs = DATA.filter(q => (state.set==="all"||q.s===state.set) && (!state.b||q.b===state.b));
  if (onlyIds) qs = DATA.filter(q => onlyIds.includes(q.id));
  if (state.shq) qs = shuffle(qs);
  deck = qs.map(q => ({q, order: state.sho ? shuffle([0,1,2,3]) : [0,1,2,3]}));
  idx = 0; answers = {};
  syncControls(); render();
}

function syncControls(){
  document.querySelectorAll("[data-set]").forEach(b => {
    const n = b.dataset.set==="all" ? DATA.length : DATA.filter(q=>q.s===b.dataset.set).length;
    b.setAttribute("aria-pressed", String(b.dataset.set===state.set && !onlyIds));
  });
  document.querySelectorAll("[data-b]").forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.b===state.b && !onlyIds)));
  document.getElementById("shuffle-q").checked = state.shq;
  document.getElementById("shuffle-o").checked = state.sho;
}

function tally(){
  let ok=0,bad=0; for (const id in answers){ answers[id].ok?ok++:bad++; } return {ok,bad};
}
function updateStatus(){
  const t = tally(), done = t.ok+t.bad;
  document.getElementById("score").innerHTML = `✓ <span class="ok">${t.ok}</span> · ✗ <span class="bad">${t.bad}</span>`;
  document.getElementById("pos").textContent = idx < deck.length
    ? `Pregunta ${idx+1} de ${deck.length}${onlyIds?" · repaso de falladas":""}`
    : `Terminado · ${deck.length} preguntas`;
  document.getElementById("bar").style.width = deck.length ? (100*done/deck.length)+"%" : "0";
}

function render(){
  const main = document.getElementById("main");
  updateStatus();
  if (!deck.length){ main.innerHTML = `<div class="card"><p class="empty">No hay preguntas con este filtro. Prueba con otro tema o con «Todas».</p></div>`; return; }
  if (idx >= deck.length) return renderSummary(main);
  const {q, order} = deck[idx], ans = answers[q.id];
  const opts = order.map((oi, pos) => {
    let cls = "opt";
    if (ans){ if (oi===q.a) cls+=" correct"; else if (oi===ans.pick) cls+=" wrong"; else cls+=" dim"; }
    return `<li><button class="${cls}" data-oi="${oi}" ${ans?"disabled":""}><span class="letter">${LETTERS[pos]}</span><span>${q.o[oi]}</span></button></li>`;
  }).join("");
  const rightPos = LETTERS[order.indexOf(q.a)];
  const fb = ans ? `<div class="feedback ${ans.ok?"":"bad"}" role="status"><strong class="v">${ans.ok?"Correcta.":"Incorrecta. La buena es la "+rightPos+"."}</strong><p class="exp">${q.e}</p></div>` : "";
  main.innerHTML = `<article class="card">
    <div class="qmeta"><span class="tag">${SETNAMES[q.s]} · nº ${q.n}</span><span class="tag">${BNAMES[q.b]}</span>${hist[q.q]&&hist[q.q].f?`<span class="tag warn">Fallada ${hist[q.q].f}×</span>`:""}</div>
    <h2 class="qtext">${q.q}</h2>
    <ul class="opts">${opts}</ul>
    ${fb}
    <div class="nav">
      <button class="btn" id="prev" ${idx===0?"disabled":""}>← Anterior</button>
      <button class="btn primary" id="next">${idx===deck.length-1?"Ver resultado":(ans?"Siguiente →":"Saltar →")}</button>
    </div>
  </article>`;
  main.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => pick(+b.dataset.oi)));
  document.getElementById("prev").onclick = () => { idx--; render(); };
  document.getElementById("next").onclick = () => { idx++; render(); };
}

function pick(oi){
  const {q} = deck[idx];
  if (answers[q.id]) return;
  answers[q.id] = {pick: oi, ok: oi===q.a};
  hrec(q, oi===q.a);
  render();
  const n = document.getElementById("next"); if (n) n.focus();
}

function renderSummary(main){
  const t = tally(), done = t.ok+t.bad, pct = done ? Math.round(100*t.ok/done) : 0;
  const byB = {};
  deck.forEach(({q}) => { const a = answers[q.id]; byB[q.b] ??= {ok:0,n:0,skip:0}; if (a){ byB[q.b].n++; if(a.ok) byB[q.b].ok++; } else byB[q.b].skip++; });
  const blocks = Object.keys(byB).sort().map(b => `<div class="blk"><b>${BNAMES[b]}</b><span>${byB[b].ok} / ${byB[b].n}${byB[b].skip?` <small class="empty">(${byB[b].skip} sin responder)</small>`:""}</span></div>`).join("");
  const failed = deck.filter(({q}) => answers[q.id] && !answers[q.id].ok).map(d => d.q);
  const skipped = deck.filter(({q}) => !answers[q.id]).map(d => d.q);
  const list = failed.map(q => `<li>${q.q}<br><span class="ans">${q.o[q.a]}</span> <span class="empty">· ${q.e.match(/B\d[^.]*p{1,2}\.[\d–, y]+/)?.[0] ?? ""}</span></li>`).join("");
  main.innerHTML = `<article class="card summary">
    <h2>Resultado</h2>
    <div><span class="big">${t.ok}/${done}</span> <span class="empty">aciertos (${pct} %)${skipped.length?` · ${skipped.length} sin responder`:""}</span></div>
    <div class="blocks">${blocks}</div>
    <div class="nav">
      <button class="btn primary" id="retry-fail" ${failed.length?"":"disabled"}>Repetir las ${failed.length} falladas</button>
      <button class="btn" id="restart">Empezar de nuevo</button>
    </div>
    ${failed.length?`<h2 style="font-size:18px">Para repasar</h2><ul class="fails">${list}</ul>`:`<p class="empty">Sin fallos en las respondidas.</p>`}
    <p class="hint">Es una puntuación diagnóstica: no predice la nota del examen.</p>
  </article>`;
  document.getElementById("retry-fail").onclick = () => build(failed.map(q=>q.id));
  document.getElementById("restart").onclick = () => build();
}

document.querySelectorAll("[data-set]").forEach(b => b.onclick = () => { state.set=b.dataset.set; save(); build(); });
document.querySelectorAll("[data-b]").forEach(b => b.onclick = () => { state.b=+b.dataset.b; save(); build(); });
document.getElementById("shuffle-q").onchange = e => { state.shq=e.target.checked; save(); build(); };
document.getElementById("shuffle-o").onchange = e => { state.sho=e.target.checked; save(); build(); };

document.addEventListener("keydown", e => {
  if (e.target.matches("input") || e.metaKey || e.ctrlKey || e.altKey) return;
  if (idx >= deck.length || !deck.length) return;
  const k = e.key.toUpperCase();
  let pos = "ABCD".indexOf(k); if (pos<0) pos = "1234".indexOf(k);
  if (pos>=0 && !answers[deck[idx].q.id]) { pick(deck[idx].order[pos]); e.preventDefault(); return; }
  if ((e.key==="Enter" && !e.target.matches("button")) || e.key==="ArrowRight") { idx++; render(); e.preventDefault(); }
  if (e.key==="ArrowLeft" && idx>0) { idx--; render(); e.preventDefault(); }
});

document.getElementById("h-pend").onclick = () => build(pending().map(q=>q.id));
document.getElementById("h-list").onclick = () => renderHist();
hbuttons();
build();
</script>
